<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenFit</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--tx:#eef0f4;--mu:#8b93a3;--ac:#4ade80;--c:#60a5fa;--p:#f472b6;--f:#fbbf24}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:78px}
main{padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin-bottom:4px}h2{font-size:17px;margin:18px 0 8px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
button{background:var(--ac);color:#06210f;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
button.g{background:#262b36;color:var(--tx)}
input{background:#12151b;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;width:100%;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:16px 4px}
nav button.on{color:var(--ac)}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.d{flex:1;min-width:46px;text-align:center;padding:8px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px}
.d.on{border-color:var(--ac)}.d.rest{opacity:.6}.d b{display:block;font-size:11px;color:var(--mu);font-weight:500}
.ex{display:flex;gap:10px;align-items:center}

.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.chk.on{background:var(--ac);border-color:var(--ac)}
.bar{height:8px;background:#262b36;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.drops{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.drop{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);flex:none}.drop.on{background:var(--c)}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.show{display:flex}.modal>div{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
video{width:100%;border-radius:10px;background:#000}
#toast{position:fixed;top:12px;left:12px;right:12px;background:var(--c);color:#04121f;padding:12px;border-radius:12px;font-weight:700;display:none;z-index:20}
/* real exercise animation: two photos cross-fade in a loop */
.vf{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#fff;flex:none}
.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf img.b{animation:fd 1.8s infinite ease-in-out}
@keyframes fd{0%,15%,100%{opacity:0}45%,70%{opacity:1}}
.big .vf{width:100%;height:auto;aspect-ratio:1}
ol{padding-left:20px;margin:8px 0}li{margin:6px 0;font-size:14px}
</style></head><body>
<div id="toast"></div>
<main id="app"></main>
<nav id="nav"></nav>
<div class="modal" id="scan"><div><video id="vid" playsinline muted></video><p class="mu" id="smsg" style="margin:8px 0">Point the camera at a barcode</p><div class="row"><button class="g" onclick="stopScan()">Close</button></div></div></div>
<div class="modal" id="vm"><div id="vbody"></div></div>
<script>
const $=s=>document.querySelector(s);
const FIG=e=>`<div class="vf"><img src="img/${e.id}_0.jpg" alt=""><img class="b" src="img/${e.id}_1.jpg" alt=""></div>`;
const PLAN={
 1:{name:'Chest',ex:[{n:"Dumbbell Bench Press",id:"Dumbbell_Bench_Press",s:"4 x 8-10",steps:["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.", "Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.", "Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.", "Repeat the movement for the prescribed amount of repetitions of your training program."]},{n:"Incline Dumbbell Press",id:"Incline_Dumbbell_Press",s:"4 x 10",steps:["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.", "Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.", "Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.", "Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."]},{n:"Dumbbell Flyes",id:"Dumbbell_Flyes",s:"3 x 12",steps:["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.", "Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.", "With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.", "Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.", "Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."]},{n:"Straight-Arm Dumbbell Pullover",id:"Straight-Arm_Dumbbell_Pullover",s:"3 x 12",steps:["Place a dumbbell standing up on a flat bench.", "Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.", "Grasp the dumbbell with both hands and hold it straight over your chest at arms length. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position.\nCaution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.", "While keeping your arms straight, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.", "At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.", "Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."]},{n:"Lying Dumbbell Tricep Extension",id:"Lying_Dumbbell_Tricep_Extension",s:"3 x 12",steps:["Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.", "As you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.", "At that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out.", "Repeat for the recommended amount of repetitions."]}]},
 2:{name:'Back',ex:[{n:"One-Arm Dumbbell Row",id:"One-Arm_Dumbbell_Row",s:"4 x 10 each",steps:["Choose a flat bench and place a dumbbell on each side of it.", "Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.", "Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.", "Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.", "Lower the resistance straight down to the starting position. Breathe in as you perform this step.", "Repeat the movement for the specified amount of repetitions.", "Switch sides and repeat again with the other arm."]},{n:"Bent Over Two-Dumbbell Row",id:"Bent_Over_Two-Dumbbell_Row",s:"4 x 10",steps:["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.", "While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.", "Slowly lower the weight again to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."]},{n:"Dumbbell Incline Row",id:"Dumbbell_Incline_Row",s:"3 x 12",steps:["Using a neutral grip, lean into an incline bench.", "Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.", "Retract the shoulder blades and flex the elbows to row the dumbbells to your side.", "Pause at the top of the motion, and then return to the starting position."]},{n:"Reverse Flyes",id:"Reverse_Flyes",s:"3 x 12",steps:["To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).", "Extend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.", "Maintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.", "The arms should be elevated until they are parallel to the floor.", "Feel the contraction and slowly lower the weights back down to the starting position while inhaling.", "Repeat for the recommended amount of repetitions."]},{n:"Dumbbell Shrug",id:"Dumbbell_Shrug",s:"3 x 15",steps:["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.", "Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.", "Lower the dumbbells back to the original position.", "Repeat for the recommended amount of repetitions."]},{n:"Hammer Curls",id:"Hammer_Curls",s:"3 x 12",steps:["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.", "The palms of the hands should be facing your torso. This will be your starting position.", "Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.", "After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.", "Repeat for the recommended amount of repetitions."]}]},
 4:{name:'Legs',ex:[{n:"Dumbbell Squat",id:"Dumbbell_Squat",s:"4 x 12",steps:["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).", "Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.", "Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.", "Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.", "Repeat for the recommended amount of repetitions."]},{n:"Dumbbell Lunges",id:"Dumbbell_Lunges",s:"3 x 10 each",steps:["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.", "Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.", "Using mainly the heel of your foot, push up and go back to the starting position as you exhale.", "Repeat the movement for the recommended amount of repetitions and then perform with the left leg."]},{n:"Split Squat with Dumbbells",id:"Split_Squat_with_Dumbbells",s:"3 x 12",steps:["Position yourself into a staggered stance with the rear foot elevated and front foot forward.", "Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.", "Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.", "At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."]},{n:"Stiff-Legged Dumbbell Deadlift",id:"Stiff-Legged_Dumbbell_Deadlift",s:"3 x 12",steps:["Grasp a couple of dumbbells holding them by your side at arm's length.", "Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.", "Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement", "Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.", "Repeat for the recommended amount of repetitions."]},{n:"Standing Dumbbell Calf Raise",id:"Standing_Dumbbell_Calf_Raise",s:"4 x 15",steps:["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.", "With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.", "As you inhale, go back to the starting position by slowly lowering the heels.", "Repeat for the recommended amount of times."]}]},
 5:{name:'Full Body',ex:[{n:"Dumbbell Clean",id:"Dumbbell_Clean",s:"3 x 8",steps:["Begin standing with a dumbbell in each hand with your feet shoulder width apart.", "Lower the weights to the floor by flexing at the hips and knees, pushing your hips back until the dumbbells reach the floor. This will be your starting position.", "To initiate the movement, violently jump upward by extending the hips, knees, and ankles to acclerate the weights upward. Maintaining a neutral grip on the dumbbells, keep the arms straight until full extension is reached.", "After full extension, rebend the hips and knees to receive the weight in a squat position. Allow the arms to bend, guiding the dumbbells to your shoulders.", "Upon receiving the weight in the squat position, extend the hips and knees to finish in a standing position with the weights on your shoulders."]},{n:"Dumbbell Shoulder Press",id:"Dumbbell_Shoulder_Press",s:"4 x 10",steps:["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.", "Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.", "Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.", "Now, exhale and push the dumbbells upward until they touch at the top.", "Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.", "Repeat for the recommended amount of repetitions."]},{n:"Vertical Swing",id:"Vertical_Swing",s:"3 x 15",steps:["Allow the dumbbell to hang at arms length between your legs, holding it with both hands. Keep your back straight and your head up.", "Swing the dumbbell between your legs, flexing at the hips and bending the knees slightly.", "Powerfully reverse the motion by extending at the hips, knees, and ankles to propel yourself upward, swinging the dumbell over your head.", "As you land, absorb the impact through your legs and draw the dumbbell to your torso before the next repetition."]},{n:"Dumbbell Step Ups",id:"Dumbbell_Step_Ups",s:"3 x 10 each",steps:["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).", "Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.", "Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.", "Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."]},{n:"Dumbbell Bicep Curl",id:"Dumbbell_Bicep_Curl",s:"3 x 12",steps:["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.", "Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.", "Then, inhale and slowly begin to lower the dumbbells back to the starting position.", "Repeat for the recommended amount of repetitions."]}]}
};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const REST={name:'Rest Day',ex:[]};
const tod=()=>new Date().toISOString().slice(0,10);
let S=JSON.parse(localStorage.getItem('openfit')||'null')||{done:{},food:{},water:{},goal:{k:2200,c:250,p:130,f:70},sel:null,tab:'plan',hist:{}};
const save=()=>localStorage.setItem('openfit',JSON.stringify(S));
const dayOf=i=>PLAN[i]||REST;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',5000)}
function nav(){const T=[['plan','Plan'],['food','Food'],['water','Water'],['stats','Progress']];$('#nav').innerHTML=T.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';save();render()">${l}</button>`).join('')}
function render(){nav();({plan,food,water,stats})[S.tab]()}
/* PLAN */
function plan(){
 const now=new Date().getDay();const sel=S.sel==null?now:S.sel;const d=dayOf(sel);const key=tod()+':'+sel;const dn=S.done[key]||{};
 let h=`<h1>Weekly Plan</h1><p class="mu">4 training days, 2 rest days. Tap a day.</p><div class="days">`;
 [1,2,3,4,5,6,0].forEach(i=>{const p=PLAN[i];h+=`<div class="d ${sel==i?'on':''} ${!p?'rest':''}" onclick="S.sel=${i};save();render()"><b>${DN[i]}</b>${p?p.name.split(' ')[0]:'Rest'}</div>`});
 h+='</div>';
 if(!d.ex.length)h+=`<div class="card"><h2 style="margin:0 0 6px">Rest and recover</h2><p class="mu">Muscles grow while you rest. Sleep 7 to 9 hours, drink water, eat enough protein and take a short walk or stretch if you feel stiff.</p></div>`;
 else{const c=d.ex.filter(e=>dn[e.n]).length;
  h+=`<h2>${d.name} Day</h2><div class="bar"><i style="width:${c/d.ex.length*100}%;background:var(--ac)"></i></div><p class="mu">${c} of ${d.ex.length} exercises done</p>`;
  d.ex.forEach((e,i)=>h+=`<div class="card ex"><div onclick="vid(${sel},${i})">${FIG(e)}</div><div style="flex:1" onclick="vid(${sel},${i})"><b>${e.n}</b><p class="mu">${e.s}</p></div><div class="chk ${dn[e.n]?'on':''}" onclick="tick('${key}','${e.n}',${sel})"></div></div>`);
  h+=`<button class="g" style="width:100%" onclick="timer()">Rest timer (60s)</button>`}
 $('#app').innerHTML=h}
function tick(k,n,sel){S.done[k]=S.done[k]||{};S.done[k][n]=!S.done[k][n];const d=dayOf(sel);if(d.ex.every(e=>S.done[k][e.n])){S.hist[tod()]=1;toast('Workout complete. Great job!')}save();render()}
function vid(d,i){const e=dayOf(d).ex[i];$('#vbody').innerHTML=`<div class="big">${FIG(e)}</div><h2>${e.n}</h2><p class="mu">${e.s}</p><ol>${e.steps.map(x=>'<li>'+x+'</li>').join('')}</ol><button class="g" onclick="$('#vm').classList.remove('show')">Close</button>`;$('#vm').classList.add('show')}
let tm;function timer(){clearInterval(tm);let n=60;toast('Rest: 60s');tm=setInterval(()=>{n--;$('#toast').textContent='Rest: '+n+'s';if(n<=0){clearInterval(tm);$('#toast').textContent='Go! Next set.';navigator.vibrate&&navigator.vibrate(300);setTimeout(()=>$('#toast').style.display='none',2000)}},1000)}
/* FOOD */
const sum=()=>{const l=S.food[tod()]||[];return l.reduce((a,x)=>({k:a.k+x.k,c:a.c+x.c,p:a.p+x.p,f:a.f+x.f}),{k:0,c:0,p:0,f:0})};
function row(l,v,g,col){return `<div style="margin:8px 0"><div class="row"><span>${l}</span><span class="mu">${Math.round(v)} / ${g}${l=='Calories'?' kcal':' g'}</span></div><div class="bar"><i style="width:${Math.min(100,v/g*100)}%;background:${col}"></i></div></div>`}
function food(){const t=sum(),g=S.goal,l=S.food[tod()]||[];
 let h=`<h1>Food Log</h1><div class="card">${row('Calories',t.k,g.k,'var(--ac)')}${row('Carbs',t.c,g.c,'var(--c)')}${row('Protein',t.p,g.p,'var(--p)')}${row('Fats',t.f,g.f,'var(--f)')}</div>
 <div class="row"><button style="flex:1" onclick="startScan()">Scan food barcode</button><button class="g" style="flex:1" onclick="manual()">Add manually</button></div><h2>Today</h2>`;
 if(!l.length)h+='<p class="mu">Nothing logged yet.</p>';
 l.forEach((x,i)=>h+=`<div class="card row"><div><b>${x.n}</b><p class="mu">${Math.round(x.k)} kcal | C ${Math.round(x.c)} | P ${Math.round(x.p)} | F ${Math.round(x.f)}</p></div><button class="g" onclick="delF(${i})">Remove</button></div>`);
 h+=`<h2>Daily goals</h2><div class="card"><div class="row"><input id="gk" type="number" placeholder="kcal" value="${g.k}"><input id="gc" type="number" placeholder="carbs" value="${g.c}"><input id="gp" type="number" placeholder="protein" value="${g.p}"><input id="gf" type="number" placeholder="fat" value="${g.f}"></div><p class="mu" style="margin:6px 0">kcal, carbs, protein, fats</p><button class="g" onclick="setG()">Save goals</button></div>`;
 $('#app').innerHTML=h}
function setG(){S.goal={k:+$('#gk').value||2200,c:+$('#gc').value||250,p:+$('#gp').value||130,f:+$('#gf').value||70};save();render()}
function delF(i){S.food[tod()].splice(i,1);save();render()}
function addF(x){(S.food[tod()]=S.food[tod()]||[]).push(x);S.hist[tod()]=S.hist[tod()]||1;save();render()}
function manual(){$('#vbody').innerHTML=`<h2 style="margin:0 0 8px">Add food</h2><input id="mn" placeholder="Name"><div class="row" style="margin:8px 0"><input id="mk" type="number" placeholder="kcal"><input id="mc" type="number" placeholder="carbs g"></div><div class="row"><input id="mp" type="number" placeholder="protein g"><input id="mf" type="number" placeholder="fat g"></div><div class="row" style="margin-top:10px"><button class="g" onclick="$('#vm').classList.remove('show')">Cancel</button><button onclick="addM()">Add</button></div>`;$('#vm').classList.add('show')}
function addM(){addF({n:$('#mn').value||'Food',k:+$('#mk').value||0,c:+$('#mc').value||0,p:+$('#mp').value||0,f:+$('#mf').value||0});$('#vm').classList.remove('show')}
/* SCAN (BarcodeDetector + Open Food Facts, both free) */
let stream,scanning=false;
async function startScan(){
 $('#scan').classList.add('show');
 if(!('BarcodeDetector' in window)){$('#smsg').textContent='Barcode scanning is not supported here. Use manual entry.';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vid');v.srcObject=stream;await v.play();
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});scanning=true;
  const loop=async()=>{if(!scanning)return;try{const r=await det.detect(v);if(r.length){scanning=false;lookup(r[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop()
 }catch(e){$('#smsg').textContent='Camera permission denied or unavailable.'}}
function stopScan(){scanning=false;stream&&stream.getTracks().forEach(t=>t.stop());$('#scan').classList.remove('show')}
async function lookup(code){$('#smsg').textContent='Found '+code+'. Looking up...';
 try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,nutriments');const j=await r.json();
  if(j.status!==1)throw 0;const n=j.product.nutriments,name=j.product.product_name||'Scanned food';stopScan();
  const g=+prompt(name+'\nHow many grams did you eat?','100')||100,m=g/100;
  addF({n:name+' ('+g+'g)',k:(n['energy-kcal_100g']||0)*m,c:(n.carbohydrates_100g||0)*m,p:(n.proteins_100g||0)*m,f:(n.fat_100g||0)*m})
 }catch(e){$('#smsg').textContent='Product not found. Close and add it manually.'}}
/* WATER */
const WT=['09:00','12:00','15:00','18:00'];
function water(){const n=S.water[tod()]||0;
 let h=`<h1>Hydration</h1><p class="mu">Reminders at ${WT.join(', ')}. Each drop is one glass (250 ml).</p><div class="drops">`;
 for(let i=0;i<8;i++)h+=`<div class="drop ${i<n?'on':''}" onclick="setW(${i<n?i:i+1})"></div>`;
 h+=`</div><p>${n*250} ml of 2000 ml</p><button style="margin-top:10px" onclick="askN()">Enable reminders</button>`;$('#app').innerHTML=h}
function setW(n){S.water[tod()]=n;save();render()}
function askN(){if('Notification' in window)Notification.requestPermission().then(p=>toast(p=='granted'?'Reminders enabled':'Notifications blocked'));else toast('Notifications not supported here')}
function chk(){const d=new Date(),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),k=tod()+t;
 if(WT.includes(t)&&S.lastN!=k){S.lastN=k;save();toast('Time to drink water');if('Notification' in window&&Notification.permission=='granted')new Notification('OpenFit',{body:'Time to drink a glass of water'})}}
setInterval(chk,20000);
/* STATS */
function stats(){let streak=0;const d=new Date();while(S.hist[d.toISOString().slice(0,10)]){streak++;d.setDate(d.getDate()-1)}
 const week=Object.keys(S.hist).filter(k=>(Date.now()-new Date(k))<7*864e5).length,tw=Object.values(S.water).reduce((a,b)=>a+b,0);
 const tips=['Progressive overload: add a little weight or one rep each week.','Protein with every meal helps recovery.','Sleep is your free supplement.','Warm up for 5 minutes before lifting.'];
 $('#app').innerHTML=`<h1>Progress</h1><div class="card"><h2 style="margin:0">${streak} day streak</h2><p class="mu">Log a meal or finish a workout to keep it alive.</p></div><div class="card"><b>${week}</b> active days this week<br><b>${tw*250/1000} L</b> water logged in total</div><div class="card"><p class="mu">Tip of the day</p><p>${tips[new Date().getDate()%tips.length]}</p></div>`}
render();chk();
</script></body></html>
